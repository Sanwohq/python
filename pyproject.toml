[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sanwo"
version = "0.3.0"
description = "Sanwo payment SDK for Python — Django, Flask, FastAPI, or standalone. One interface for every payment provider."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "SanwoHQ", email = "hello@sanwohq.com" },
]
keywords = [
    "payments",
    "paystack",
    "flutterwave",
    "razorpay",
    "monnify",
    "interswitch",
    "sanwo",
    "django",
    "flask",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "markupsafe>=2.0",
]

[project.optional-dependencies]
django = [
    "django>=4.2",
]
flask = [
    "flask>=2.0",
]
fastapi = [
    "fastapi>=0.100",
    "jinja2>=3.0",
]

[project.urls]
Homepage = "https://sanwohq.com"
Documentation = "https://docs.sanwo.dev"
Repository = "https://github.com/Sanwohq/python"

[tool.hatch.build.targets.wheel]
packages = ["src/sanwo"]
